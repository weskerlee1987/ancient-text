name: Build and Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-g1z7tic1gltl16q5.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: crpi-g1z7tic1gltl16q5.cn-hangzhou.personal.cr.aliyuncs.com/weskerlee-ocr/weskerlee-ocr:v1
