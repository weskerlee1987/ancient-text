<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>新月馆 · 剑道人形测试</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;background:#0b0e17;color:#e0e4ed;min-height:100vh;overflow-x:hidden}
#stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;width:min(calc(100vw - 18px),460px);margin:0 auto;padding:1.2rem 0 4rem}

/* ── Header ── */
.header{text-align:center;padding:1.5rem .5rem 1.8rem;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:2px;background:linear-gradient(90deg,transparent,#d4a853,transparent)}
.header .badge{display:inline-block;font-size:.7rem;color:#5a6274;letter-spacing:4px;border:1px solid rgba(212,168,83,.15);padding:3px 14px;border-radius:20px;background:rgba(212,168,83,.04);margin-bottom:.6rem}
.header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#f0d68a,#d4a853,#b8862d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;line-height:1.2}
.header .lead{font-size:.82rem;color:#8892a4;margin-top:.7rem;line-height:1.5}
.header .lead em{font-style:normal;color:#d4a853}
.header .desc{margin-top:1.2rem;padding:.9rem 1rem;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:16px;text-align:left;font-size:.78rem;color:#6b7280;line-height:1.65}
.header .desc strong{color:#a0a8b8;font-weight:600}
.header .author{font-size:.65rem;color:#4a5264;margin-top:1rem;letter-spacing:1px}

/* ── Buttons ── */
.action-wrap{display:grid;gap:8px;margin-top:1.2rem}
.btn-primary{background:linear-gradient(135deg,#d4a853,#b8862d);color:#0b0e17;border:none;border-radius:14px;padding:14px;font-size:.9rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s;box-shadow:0 8px 24px rgba(212,168,83,.2)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.04);color:#e0e4ed;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px;font-size:.8rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s}
.btn-ghost:active{transform:scale(.97)}
.hidden{display:none!important}

/* ── Quiz Stage ── */
.quiz-stage{min-height:calc(100vh - 3rem);display:flex;flex-direction:column;justify-content:center}
.progress-bar{margin:0 4px 1rem}
.progress-track{width:100%;height:6px;overflow:hidden;border-radius:3px;background:rgba(255,255,255,.06)}
.progress-fill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#d4a853,#f0d68a);transition:width .25s ease}
.progress-meta{display:flex;justify-content:space-between;margin-top:6px;color:#5a6274;font-size:.7rem}

.question-card{background:linear-gradient(145deg,rgba(26,30,43,.8),rgba(13,16,26,.8));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:1.5rem 1.2rem;position:relative;overflow:hidden}
.question-card::before{content:'';position:absolute;top:-60px;right:-60px;width:140px;height:140px;border-radius:50%;background:rgba(212,168,83,.04);pointer-events:none}
.question-card>:not(.qtag){position:relative;z-index:1}
.qtag{font-size:.6rem;color:#5a6274;letter-spacing:2px;font-weight:500;position:relative;z-index:1}
.question-card h3{margin-top:.6rem;font-size:clamp(1.15rem,5.8vw,1.55rem);font-weight:600;line-height:1.45;color:#e0e4ed}
.options{display:grid;gap:10px;margin-top:1rem}
.opt-btn{text-align:left;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s;min-height:60px;font-family:inherit;color:#e0e4ed;font-size:.82rem;font-weight:400}
.opt-btn:active{background:rgba(212,168,83,.06);border-color:rgba(212,168,83,.2)}
.opt-btn strong{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;font-size:.75rem;font-weight:700;color:#d4a853;background:rgba(212,168,83,.1);flex-shrink:0;padding-top:1px}
.opt-btn span{padding-top:3px;line-height:1.5}

/* ── Result ── */
.result-card{background:linear-gradient(145deg,rgba(26,30,43,.85),rgba(13,16,26,.85));border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:1.2rem;text-align:center;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;inset:8px;border:1px solid rgba(212,168,83,.04);border-radius:18px;pointer-events:none;z-index:0}
.result-card>*{position:relative;z-index:1}
.result-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-align:left;margin-bottom:.5rem}
.result-eyebrow{font-size:.55rem;color:#5a6274;letter-spacing:3px;font-weight:500}
.result-type{font-size:.5rem;color:#3a4254;letter-spacing:2px}
.result-label{font-size:.78rem;color:#6b7280;font-weight:500;margin-top:.8rem}
.result-avatar{width:100%;margin:1rem auto;overflow:hidden;border-radius:18px;border:1px solid rgba(212,168,83,.16);box-shadow:0 0 40px rgba(212,168,83,.07);background:linear-gradient(145deg,rgba(26,30,43,.85),rgba(13,16,26,.85))}
.result-avatar svg{width:100%;height:100%;display:block}
.result-avatar img{width:100%;height:auto;display:block}
.result-name{font-size:clamp(1.7rem,9vw,2.8rem);font-weight:700;background:linear-gradient(135deg,#f0d68a,#d4a853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.05;margin-top:2px}
.result-meta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:.5rem}
.result-code{display:inline-block;padding:5px 11px;border-radius:8px;background:#d4a853;color:#0b0e17;font-size:.85rem;font-weight:700;letter-spacing:2px}
.result-match{display:inline-block;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.04);color:#6b7280;font-size:.7rem;font-weight:600}
.result-summary{padding:.8rem;border-radius:14px;background:rgba(212,168,83,.06);border:1px solid rgba(212,168,83,.08);font-size:.85rem;font-weight:600;line-height:1.5;color:#e0e4ed;margin-top:.6rem}
.result-verdict{margin-top:.6rem;padding:.7rem .8rem;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);text-align:left}
.result-verdict .vl{font-size:.6rem;color:#5a6274;font-weight:500;letter-spacing:2px;margin-bottom:4px}
.result-verdict .vt{font-size:.75rem;color:#8892a4;line-height:1.55;font-weight:400}
.result-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:.7rem}
.result-tags span{padding:4px 8px;border-radius:6px;font-size:.7rem;font-weight:500;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:#6b7280}
.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:.6rem}
.dim-item{padding:5px 8px;border-radius:10px;font-size:.68rem;font-weight:500;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);color:#5a6274}
.result-footer{font-size:.6rem;color:#3a4254;margin-top:.8rem;letter-spacing:2px}

.share-panel{margin-top:.8rem;padding:1rem;border-radius:18px;background:rgba(26,30,43,.6);border:1px solid rgba(255,255,255,.04)}
.share-box{padding:.8rem;border-radius:12px;background:rgba(255,255,255,.02);border:1px dashed rgba(212,168,83,.2)}
.share-box .sl{font-size:.6rem;color:#5a6274;font-weight:500;letter-spacing:2px;margin-bottom:5px}
.share-box .st{font-size:.75rem;color:#8892a4;line-height:1.6}
.share-acts{display:grid;gap:8px;margin-top:.7rem}

.result-notes{display:grid;gap:10px;margin-top:.7rem}
.result-notes article{padding:1rem;border-radius:18px;background:rgba(26,30,43,.6);border:1px solid rgba(255,255,255,.04)}
.result-notes h3{font-size:.85rem;font-weight:600;color:#d4a853;margin-bottom:5px}
.result-notes p{font-size:.75rem;color:#6b7280;line-height:1.6;margin:0}
.scroll-hint{margin-top:.7rem;font-size:.62rem;color:#3a4254;text-align:center;letter-spacing:1px}
.scroll-hint::after{content:" \2193";color:#d4a853}


#game-ui{width:100%}
.game-ui-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:200px}
.r4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:100%;max-width:340px;margin:0 auto}
.r4z{padding:14px;border-radius:16px;border:2px solid rgba(255,255,255,.06);background:linear-gradient(145deg,rgba(26,30,43,.7),rgba(13,16,26,.7));text-align:center;font-size:clamp(1.2rem,5vw,1.8rem);font-weight:700;color:#5a6274;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1.3}
.r4z:active{transform:scale(.95)}
.r4z.active{border-color:#d4a853;background:rgba(212,168,83,.12);box-shadow:0 0 25px rgba(212,168,83,.2);color:#f0d68a}
.r4z.hit{background:rgba(76,175,80,.25)!important;border-color:#4caf50!important;color:#4caf50!important}
.r4z.miss{background:rgba(244,67,54,.2)!important;border-color:#f44336!important;color:#f44336!important}
.rw{position:relative;width:100%;height:260px;display:flex;align-items:center;justify-content:center}
.rb{position:absolute;padding:14px 24px;border-radius:16px;border:2px solid rgba(212,168,83,.3);background:linear-gradient(135deg,#d4a853,#b8862d);color:#0b0e17;font-size:.9rem;font-weight:700;cursor:pointer;transition:left .08s,top .08s;white-space:nowrap}
.rb:active{transform:scale(.92)}
.ta{width:100%;height:260px;border-radius:20px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.015);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.tc{font-size:clamp(2.5rem,12vw,4rem);font-weight:900;color:#f0d68a;line-height:1;pointer-events:none;position:relative;z-index:2}
.tl{font-size:.7rem;color:#5a6274;letter-spacing:2px;pointer-events:none;position:relative;z-index:2}
.fms{font-size:1rem;font-weight:600;color:#e0e4ed;line-height:1.4;margin:.5rem 0;min-height:3rem}
.fmb{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:300px;margin:.5rem auto}
.fm{padding:16px;border-radius:16px;border:2px solid rgba(255,255,255,.06);background:linear-gradient(145deg,rgba(26,30,43,.7),rgba(13,16,26,.7));cursor:pointer;text-align:center}
.fm:active{transform:scale(.94)}
.fm .da{font-size:clamp(1.1rem,5vw,1.5rem);font-weight:700;color:#e0e4ed}
.fm .dl{font-size:.7rem;color:#5a6274;margin-top:3px}
.fm.correct{background:rgba(76,175,80,.15)!important;border-color:#4caf50!important;color:#4caf50!important}
.fm.wrong{background:rgba(244,67,54,.12)!important;border-color:#f44336!important;color:#f44336!important}
.ba{text-align:center;padding:1rem}
.bt{font-size:clamp(2.5rem,12vw,4rem);font-weight:900;color:#e0e4ed;line-height:1}
.bu{font-size:.75rem;color:#5a6274;margin-top:4px}
.bl{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin:.5rem 0;height:80px}
.bl2{width:35px;border-radius:17px 17px 24px 24px;background:rgba(212,168,83,.08);border:1px solid rgba(212,168,83,.12);position:relative;overflow:hidden}
.bl2 .f{position:absolute;bottom:0;left:0;right:0;background:rgba(212,168,83,.2);border-radius:0 0 23px 23px;transition:height .1s linear}
.fb{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;padding:12px 24px;border-radius:16px;font-size:1.2rem;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s}
.fb.show{opacity:1}
.fb.ok{background:rgba(76,175,80,.2);border:1px solid rgba(76,175,80,.4);color:#4caf50}
.fb.fail{background:rgba(244,67,54,.2);border:1px solid rgba(244,67,54,.4);color:#f44336}
.gi{display:flex;justify-content:space-between;font-size:.72rem;color:#5a6274;padding:0 .3rem;margin:.3rem 0;width:100%}
.gi strong{color:#d4a853;font-weight:700}

@media(hover:hover){
  .opt-btn:hover{background:rgba(212,168,83,.06);border-color:rgba(212,168,83,.15);transform:translateY(-1px)}
  .btn-primary:hover{box-shadow:0 12px 30px rgba(212,168,83,.3)}
}

/* ── Game Intro / Result ── */
.game-intro{text-align:center;padding:.4rem .1rem}
.gi-badge{font-size:1.7rem;margin-bottom:.2rem}
.gi-title{font-size:1.08rem;font-weight:700;color:#e0e4ed;margin-bottom:.55rem;line-height:1.3}
.gi-desc{font-size:.78rem;color:#8892a4;line-height:1.65;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:.75rem .85rem;margin:.5rem 0}
.gi-rule{font-size:.73rem;color:#6b7280;line-height:1.7;text-align:left;padding:.1rem .2rem .7rem}
.gi-rule b{color:#d4a853;font-weight:600}
.gi-rule .sc{color:#f0d68a;font-weight:700}
.game-result{text-align:center;padding:1rem .1rem}
.gr-title{font-size:.68rem;color:#5a6274;letter-spacing:2px;margin-bottom:.45rem}
.gr-score{font-size:2.1rem;font-weight:900;color:#f0d68a;line-height:1.1;margin:.25rem 0}
.gr-sub{font-size:.75rem;color:#4a5264;letter-spacing:1px;margin-bottom:.2rem}
.gr-msg{font-size:.82rem;color:#8892a4;margin:.5rem 0 1rem;line-height:1.5}
#gs-start{width:100%;margin-top:.6rem}
#gs-next{width:100%;margin-top:.6rem}
/* ── 闪躲大作战 ── */
#dodge-canvas{width:100%;height:340px;border-radius:16px;background:rgba(8,11,20,.9);border:1px solid rgba(212,168,83,.18);display:block;touch-action:none;cursor:none}
.dodge-stats{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#8892a4;margin:.45rem .2rem .1rem}
.dodge-stats b{color:#f0d68a;font-weight:700}
.dodge-hearts{letter-spacing:2px;font-size:.85rem}
.dodge-hearts .oh{color:#f44336}
.dodge-hearts .od{opacity:.18}
.dodge-tip{font-size:.68rem;color:#4a5264;text-align:center;margin-top:.35rem}
.gi-rule .lvl{color:#f44336;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
// 保存结果图：把结果卡截成图片
$('save-result').addEventListener('click',function(){
  var btn=this;
  if(!window.html2canvas){btn.textContent='加载组件中...';var ns=document.createElement('script');ns.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';ns.onload=function(){doSave(btn);};document.head.appendChild(ns);return;}
  doSave(btn);
});
function doSave(btn){
  btn.textContent='生成中...';
  html2canvas($('rcard'),{backgroundColor:'#0b0e17',scale:2,useCORS:true}).then(function(canvas){
    var url=canvas.toDataURL('image/png');
    try{
      var link=document.createElement('a');
      link.href=url;link.download='我的剑道人形测试结果.png';
      document.body.appendChild(link);link.click();document.body.removeChild(link);
      btn.textContent='已生成，可保存/分享';setTimeout(function(){btn.textContent='保存结果图';},2200);
    }catch(e){ btn.textContent='长按下方图片保存';
      var w=window.open('','_blank');if(w){w.document.write('<img src="'+url+'" style="width:100%;max-width:480px;margin:0 auto;display:block">');w.document.title='我的剑道人形测试结果';}
    }
  }).catch(function(e){btn.textContent='生成失败:'+e.message;});
}
</script>
</head>
<body>
<canvas id="stars-canvas"></canvas>

<div class="shell">

<div class="header" id="hero">
  <span class="badge">XYPD · 新月剑道馆</span>
  <h1>剑道人形测试</h1>
  <p class="lead">测测你在馆里到底是什么<em>品种</em><br>认真答，别装</p>
  <div class="desc" id="intro">
    <strong>▎28 道题，测出你的馆内人设</strong><br>
    没有标准答案，只有真实的你。<br>
    题目全来自新月馆的真实训练场景——<br>
    答完你就明白师父那个眼神是怎么回事了。
  </div>
  <div class="action-wrap"><button class="btn-primary" id="start-quiz">开始测试</button></div>
  <p class="author">新月馆后勤人员 出品</p>
</div>

<!-- Quiz -->
<section class="hidden" id="quiz-panel">
<div class="quiz-stage hidden" id="quiz-stage">
  <div class="progress-bar">
    <div class="progress-track"><div class="progress-fill" id="pf"></div></div>
    <div class="progress-meta"><span id="pq">第 1 题</span><span></span></div>
  </div>
  <div class="question-card">
    <p class="qtag" id="qtag">第 1 题</p>
    <h3 id="qtitle"></h3>
    <div class="options" id="qopts"></div>
  </div>
</div>
</section>
<!-- Game Stage -->
<div class="quiz-stage hidden" id="game-stage">
  <div class="progress-bar">
    <div class="progress-track"><div class="progress-fill" id="pf2"></div></div>
    <div class="progress-meta"><span id="pq2">验证关卡</span><span></span></div>
  </div>
  <div class="question-card" id="game-card" style="min-height:380px">
    <p class="qtag" id="game-tag">验证关卡</p>
    <h3 id="game-title" style="font-size:.9rem">准备好了吗？</h3>
    <div id="game-content"></div>
    <div id="game-ui" class="game-ui-wrap"></div>
    <div id="game-error" style="display:none;padding:.5rem;background:rgba(244,67,54,.15);border-radius:12px;margin-top:1rem;font-size:.75rem;color:#f44336;text-align:center"></div>
  </div>
</div>
<div id="fb" class="fb"></div>

<!-- Result -->
<section class="hidden" id="result-panel">
<div class="result-card" id="rcard">
  <div class="result-hd">
    <span class="result-eyebrow">新月馆 · 人设判定</span>
    <span class="result-type">16 种馆内品种</span>
  </div>
  <p class="result-label">你的馆内人设：</p>
  <div class="result-avatar" id="ravatar"></div>
  <h2 class="result-name" id="rname"></h2>
  <div class="result-meta">
    <span class="result-code" id="rcode"></span>
    <span class="result-match" id="rmatch"></span>
  </div>
  <p class="result-summary" id="rsum"></p>
  <div class="result-verdict">
    <p class="vl">判词</p>
    <p class="vt" id="rdetail"></p>
  </div>
  <div class="result-tags" id="rtags"></div>
  
  <p class="result-footer">新月馆后勤人员 出品</p>
  <p class="scroll-hint">下滑还有馆友锐评和服药指南</p>
</div>

<div class="share-panel">
  <div class="share-box">
    <p class="sl">分享文案</p>
    <p class="st" id="rshare"></p>
  </div>
  <div class="share-acts">
    <button class="btn-primary" id="copy-result">复制文案</button>
    <button class="btn-primary" id="save-result">保存结果图</button>
    <button class="btn-ghost" id="restart-quiz">重新测一遍</button>
  </div>
</div>

<div class="result-notes">
  <article><h3>小游戏战绩</h3><p id="rgame"></p></article>
  <article><h3>人格深度解析</h3><p id="rdeep"></p></article>
  <article><h3>馆友锐评</h3><p id="rsocial"></p></article>
  <article><h3>服药指南</h3><p id="radvice"></p></article>
</div>
</section>
</div>

<script>
// ── Stars ──
(function(){
  const c=document.getElementById('stars-canvas'),ctx=c.getContext('2d');
  let w,h,s=[];
  function r(){w=c.width=innerWidth;h=c.height=innerHeight;s=[];for(let i=0;i<80;i++)s.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,a:Math.random(),s:Math.random()*.005+.002})}
  function d(){ctx.clearRect(0,0,w,h);s.forEach(p=>{p.a+=p.s;let o=.3+Math.sin(p.a)*.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,210,230,${o})`;ctx.fill()});requestAnimationFrame(d)}
  window.addEventListener('resize',r);r();d();
})();

// ── Data ──
const AXIS={

const R={
  MBYK:{n:"馆内老阴师",s:"你的剑道不是正面冲突，是心理博弈。表面岁月静好，内心已经给对方安排了三种死法。",d:"你最擅长的事是让别人打得难受。你不是不攻击，你只是等别人自己犯错。你是新月馆里那种打的时候不痛不痒，打完回家越想越气的人。",so:"馆友跟你打完通常会沉默两秒，然后憋出一句「妈的，又被你阴了一道」。",a:"心眼已经够多了。偶尔光明正大赢一次，不然大家真以为你只会走偏门。阳间赢法也挺爽的，你试试。",sh:"测完了，我是新月馆的「馆内老阴师」。不是不出手，是在等你自投罗网。表面岁月静好，心里已经给你安排了三种死法。",tg:["心眼在线","等你送","打完越想越气"],cd:"M·B·Y·K",bg:"#1a2040",ac:"#5a7a5a",fc:"smirk",x:"你不是不想赢，是不敢先露出要赢的意思。等你自发错、让对手自进罗网，是你对失控的本能恐惧——怕一旦主动就被看穿、被拿捏，所以宁可用「等」保住掌控。可剑道的真相是：真正的高手是敢先出手、也接得住后果的人。你缺的不是心眼，是「被看透也没关系」的底气。试着在对手还没错时就主动推进一次——正面交锋的风险，没你想象的大。"},
  MBYG:{n:"省电演技家",s:"表面上快没电了，其实后台在偷偷全速运行。能用表情解决的事，绝不动用体力。",d:"你很会管理别人对你的预期。能装死就装死，但该出手的时候从不含糊。你的哲学：先让别人以为你不行，然后突然行一下——翻倍快乐翻倍震惊。",so:"馆友经常以为你今天只是来凑数的，结果你突然一剑打得全场安静。",a:"装可以——别装到真没电了。你比表现出来的强，偶尔不藏那么深，让大家知道你也不是纯休眠模式。",sh:"测完了，我是新月馆的「省电演技家」。看起来快没电了，其实后台在偷偷运行。主打一个低功耗高回报。",tg:["低耗高能","假装不行","实则全在算"],cd:"M·B·Y·G",bg:"#1a2420",ac:"#8a7a5a",fc:"sleep",x:"你用「看起来没电」管理别人的期待，也顺便管理自己的安全：藏拙让你进可攻退可守——输了有「我本来就懒」的台阶，赢了有「深藏不露」的惊喜。但这也是一种自我保护：你怕全力以赴仍失败，怕真实水平被评价。剑道里这叫「不投入而求稳」，能苟住，却难精进。你比你以为的强得多，偶尔把电充满、把真实水平亮出来打一场，让「行」被看见，你会更自在。"},
  MBFK:{n:"闷声偷点怪",s:"你低调得像背景板，但你总是在别人不注意的时候突然抢下一口气。安静，但有牙。",d:"你不爱出风头，但你对时机有一种安静的凶狠——像馆里一把暗器。别人以为你佛，结果你该顶的时候一点不软。",so:"馆友容易低估你，直到跟你对上才发现：原来你不是没火，是把火藏起来等我了。",a:"已经够会藏了。下次赢了稍微嘚瑟一下——让人知道你不是运气好，是真的有牙。",sh:"测完了，我是新月馆的「闷声偷点怪」。看起来像背景板，其实在等你露出破绽。安静但有牙。",tg:["安静有牙","不响但准","延迟存在感"],cd:"M·B·F·K",bg:"#1a2224",ac:"#4a6a5a",fc:"calm",x:"你不爱表达，骨子里却争强好胜——只是把锋芒藏在沉默里。你在意结果，却不想让人看到你在意。这不纯粹是低调，更像是不愿暴露渴求、怕显得吃力。剑道的「隐」若搭配真正出手的时机，是很可怕的；但若只是为了藏而不被注意，就委屈了自己。你的火一直都在，不必总等对方露破绽——你完全有资格主动要一分。藏着赢，和敢于赢，是两种不同的人生。"},

  MJYK:{n:"卷王老六",s:"最卷的人里心眼最多的，心眼最多的人里最卷的。又细又狠，说的就是你。",d:"你不是单纯努力，也不是单纯会算——你两边都要。别人靠热情练剑道，你靠结构细节和计算把对面按进Excel。你不会大声喊，但压迫感一格一格把空间锁死。",so:"馆友觉得跟你打像被审计——每一步都有预算，每一剑都有KPI。你不是在练剑，是在做项目管理。",a:"别把所有对练都当棋下。偶尔失控一下不会死——甚至能让大家发现你也不是纯人机。",sh:"测完了，我是新月馆的「卷王老六」。我不是来快乐剑道的，我是来把对手按进Excel的。",tg:["又细又狠","压迫感满","每一步都有目的"],cd:"M·J·Y·K",bg:"#1a2230",ac:"#4a6a6a",fc:"focus",x:"你把剑道打成了项目——目标、拆解、复盘，样样精确。你喜欢把一切攥在手里，靠结构换确定感，这让你稳定，也让你累。问题在于你把每场对练都当棋下，赢了棋却丢了「人」，连对手的表情都当数据读。剑道是修心，不是修KPI。真正的高手除了计算，还得有临场放空、交给身体的瞬间。试着不预设、不打小算盘地打一场，你会发现失控里也有好东西。"},
  MJYG:{n:"考核型选手",s:"平时不一定最炸，但一到需要展示的时候就会突然变得很像回事。你的剑道带有交付意识。",d:"你很懂怎么把努力变成可见成果。每当局里盯着看、有人瞄着你的时候，你就会突然上线——动作气势节奏全部到位。",so:"馆友说你太会了，但也承认你确实会拿分。你身上有一种把职场带进剑道馆的味道：动作可交付，气势要对齐。",a:"别只在有观众的时候才认真。日常也全力以赴一下——不然你的剑道会越来越像季度汇报。",sh:"测完了，我是新月馆的「考核型选手」。动作要呈现，气势要对齐——别人练剑，我像在做绩效材料。离谱但有效。",tg:["场合感强","很会呈现","目标明确"],cd:"M·J·Y·G",bg:"#1a2428",ac:"#8a7a4a",fc:"spark",x:"你太擅长「被看见时用力」——有人盯着，动作气势全拉满；没人看，你就松了。这是典型的外部评价驱动：你靠别人的认可确认自己价值，所以总在考场发力，日常反而躺平。可剑道的功夫，恰恰藏在没人看的日子里。只会在有观众时精彩，是表演；任何一天都稳定地练，才是修行。你的底色很优秀，缺的是把「认真」从有观众时，延伸到每个无人问津的日常。"},
  MJFK:{n:"偷偷升级的卷王",s:"嘴上说随便练练，身体一次没少来。练着练着别人发现——你怎么突然变强了？",d:"你是最容易低估的新月馆选手。不说狠话不表演，但你一直来一直练一直改。你不是天降主角，是后台静默更新。别人还在宣布重新做人，你已经偷偷练完一轮了。",so:"馆友一开始不会注意你。但时间一长，大家突然发现：你什么时候变强的？你是不是背着大家开会员了？",a:"你已经很能熬了。偶尔把成果打出来，别总在角落偷偷升级——不然大家只觉得你阴得很低调。",sh:"测完了，我是新月馆的「偷偷升级的卷王」。嘴上说随便练练，身体一次没少来。练着练着——你怎么打不过我了？",tg:["静音升级","后台变强","稳定基本盘"],cd:"M·J·F·K",bg:"#1a2624",ac:"#5a7a68",fc:"calm",x:"你嘴上说随便练练，身体却从没缺席——你渴望变强，又不想让人看出你想变强，怕一旦认真却没进步会很狼狈。于是选择「静默更新」：偷偷努力，等实力到位再让人惊讶。这不是错，但有点累：你把自己塞进了「怕被看轻就别声张」的框里。其实承认「我在认真变强」一点也不丢人，反而能吸引同频的人。你够能熬了，偶尔把成果亮出来，让大家知道，你值得被看见。"},
  MJFG:{n:"标准答案",s:"你不炸裂，但不出错。新月馆的稳定基本盘——别人负责疯，你负责安全送到及格线。",d:"你很烦人的稳定。别人还在上头抽象白给，你已经把动作距离节奏都按标准摆好了。你的强不是爆炸，是稳稳把自己送过线。",so:"馆友觉得你像标准答案。但真到需要稳定输出的时候，大家又会默默想起你。不炸场，但能过线。",a:"已经很稳了——下次给自己一点锋芒，不然大家只记得你能过，不记得你能吓人。",sh:"测完了，我是新月馆的「标准答案」。动作合规节奏在线，不出错就是我的美学。别人负责疯，我负责安全下班。",tg:["稳定过线","不出错美学","安心基本盘"],cd:"M·J·F·G",bg:"#1a2422",ac:"#6a7a5a",fc:"calm",x:"你的追求是「不出错」——动作规范、节奏到位、安全过线。这让你成为最让人放心的存在，但也在悄悄限制你：你的上限被「别出错」的天花板顶住了。剑道的进步，恰恰来自敢出错的尝试——那些打偏的、笨拙的尝试，才是突破的入口。你是稳定的基本盘，这很好；但别让「稳」变成「怂」。偶尔打出一记不在标准框里的狠招，让大家吓一跳，也让你的剑道多一层锋利。"},
  LBYK:{n:"热血笨蛋",s:"脑子还在加载，身体已经冲了。燃是真的燃，白给也是真的白给。你是新月馆的气氛点火器。",d:"你最擅长把普通训练打出决战的气氛。对面还没动你先燃了，机会还没出来你已经冲了。你不是不会想——是想法赶到的时候战斗已经结束了。你是最像热血主角的人，也是最常在白给后尴尬挠头说「再来一把」的人。",so:"馆友一边笑你中二，一边靠你那股傻劲续命。你是新月馆的快乐打火机——一出现大家就知道今天不会太平。",a:"别戒热血——那是你的超能力。你要做的是给热血装个刹车，不然每次都像把自己发射出去，落点全靠命。",sh:"测完了，我是新月馆的「热血笨蛋」。脑子还在加载身体已经冲了。气势必须准时上班，理智——下次一定带。",tg:["先冲再说","白给专业户","气氛点火"],cd:"L·B·Y·K",bg:"#2a1e1a",ac:"#b86a4a",fc:"spark",x:"你是一腔热血直着冲的典型，身体永远先于脑子，是所有人心里的气氛点火器。你的燃给了很多人支撑，却也让你每次都不留余地，冲动过后常空空落落。你缺的不是勇气，是节奏。热血的超能力，配上「三秒深呼吸」的刹车，就不再是白给，而是真正的猛。别戒掉那份冲劲，但要学着让它在该爆的瞬间爆，而不是总第一个爆。"},
  LBYG:{n:"显眼包本包",s:"不一定最强，但你一来馆里就像插了电——还顺便开了音响。有人练剑，有人负责把练剑变成综艺。",d:"你靠存在感活着。喊声表情吐槽反应一个不少，你不一定每一剑都中，但一定每一剑都有节目效果。你不是来抢镜的——你站在那里镜头就自己转过来了。",so:"大家嘴上说你吵——但你不来的时候馆里安静得像进了图书馆。你是那种让训练有声音的人。",a:"气氛是你的超能力。再补一点技术，别人就不只是笑你——是笑着笑着发现打不过你了。",sh:"测完了，我是新月馆的「显眼包本包」。我来了馆里像过年——中不中另说，气氛必须拉满。",tg:["人未到声先到","气氛担当","自带弹幕"],cd:"L·B·Y·G",bg:"#2a2420",ac:"#b87a4a",fc:"happy",x:"你需要存在感，像植物需要光——靠别人的反应确认「我在场」，所以你是气氛担当，也是情绪开关。这不全是虚的，你的生命力确实能点燃一屋子人。但「显」和「苟」在你身上并存：热闹给所有人看，真实的需求却很少让人碰。别让「热闹」变成躲避深度的方式。你被喜欢，不只因为你吵、你好笑，更因为你有温度。偶尔安静下来，让人看看你的认真，他们会更喜欢那个真实的你。"},
  LBFK:{n:"菜刀战神",s:"不一定打得对，但一定不怕死。技术可以抽象，杀心不能打折。菜得坦荡，狠得真诚。",d:"你的剑道哲学：不一定会，但真敢上。你可能会白给，但白给之前一定要让对面也掉块肉——换命不亏，血赚的是精神。有时候你确实很抽象，但一旦杀疯了也是真的能打穿。",so:"馆友跟你打很矛盾——说你菜吧你真敢顶，说你强吧你动作又很野。最烦的是你明明乱，但乱得有攻击性。",a:"狠是天赋，菜是现状。不用变温柔——把动作练准一点，大家会发现你不是莽，是危险。",sh:"测完了，我是新月馆的「菜刀战神」。不一定会但真敢上——菜得坦荡狠得真诚。来新月馆找我？先想好要不要跟我换命。",tg:["不一定会但真敢","白给也要带走一个","菜得真诚"],cd:"L·B·F·K",bg:"#2a2018",ac:"#9a6a4a",fc:"focus",x:"你信奉「换命不亏」——不怕死，敢硬顶，就算菜也要让对手掉块肉。这份血性在怯弱成风的时代很珍贵，但也暴露了你给自己设的局：你怕的是「显得笨拙、软弱」，所以宁可宁死不苟，用凶狠掩饰不确定。真正的勇，不是不怕输，而是输了也不羞耻。你狠是真狠，若能学会「聪明地狠」——把动作练准、把时机看透——你会从让人皱眉的莽夫，变成让人忌惮的强敌。别丢血性，给它加个准星。"},
  LBFG:{n:"快乐广播体操",s:"动作不一定对，但汗一定出。态度拉满，精准度随缘。不强求技术，但情绪价值拉满。",d:"你最大的天赋不是剑术——是快乐出勤。不管练成什么样，反正人来了护具穿了汗流了。赢了血赚输了不亏。别人练剑是修行，你练剑像参加大型快乐广播体操——快乐拉满。",so:"馆友一边纠正你一边被你治愈。你是馆里的快乐背景音——少了你馆里少了一半人味。",a:"继续快乐——但偶尔认真一下，你会发现：妈的，原来我也不是完全不会。快乐和进步可以同时有。",sh:"测完了，我是新月馆的「快乐广播体操」。技术先不谈情绪价值拉满——来都来了汗也出了，剑道有没有进步不知道，但我确实很快乐。",tg:["快乐出勤","动作随缘","情绪价值"],cd:"L·B·F·G",bg:"#1a2820",ac:"#7a9a5a",fc:"happy",x:"你把出勤当快乐，技术随缘、情绪拉满——这不是懒，是你提前选了「不跟自己较劲」的路。你怕较劲之后仍不够好会伤到自己，所以用快乐筑了道墙。可剑道的修行，恰恰在「较劲」里发生蜕变。你的乐观是天赋，但别让它成为逃避深度的借口。试着在快乐的同时，认真抠一次动作、较真练一组——你会发现「认真」和「快乐」不是反义词，认真带来的进步，比随缘快乐更踏实。"},
  LJYK:{n:"干就完了战神",s:"想那么多干嘛——干就完了。别人还在判断距离，你已经把人撞上去了。脑子？下次一定带。",d:"你的剑道突出一个身体比脑子快。你不是完全不会思考——是身体根本不给脑子排队的机会。启动速度拉满，加载进度为零。",so:"馆友爱看你打——你一上场就一定有事发生；也怕跟你打——因为那个事大概率发生在自己身上。你是新月馆的野生启动按钮，没人知道按下去会炸哪里但一定很响。",a:"你够勇了。冲之前多看一眼——就一眼——能少白给很多次。",sh:"测完了，我是新月馆的「干就完了战神」。脑子还在加载身体已经开团。我的剑道没有前摇——只有启动。",tg:["先干再说","身体比脑子快","启动没有前摇"],cd:"L·J·Y·K",bg:"#2a1c18",ac:"#a85a3a",fc:"focus",x:"你身体比脑子快、启动没有前摇，是彻底的「先干再说」。你讨厌犹豫、讨厌想太多，因为想清楚就可能不敢做。这是对「停滞」的恐惧——你宁可犯错，也不愿停在原地。可剑道恰恰需要「间合」，需要那零点几秒的交锋判断。一味地冲，是把勇敢浪费在不需要勇敢的地方。你不是不能想，是习惯了不让想。试着在冲之前多留半秒看对手——敢想敢做的人，比只敢做的人走得更远。"},
  LJYG:{n:"悲壮主角",s:"你是真的努力，也是真的有戏。你的训练自带BGM——悲壮的那种。别人流汗是训练，你流汗像剧情进入第二幕。",d:"一次普通切返训练到你心里已经剪成了成长蒙太奇。你不是不认真——是太容易把自己演成命运悲惨的主角。累了不是累了，是第二幕低谷。",so:"馆友知道你是在真燃烧——只是别人累了是累了，你累了像马上要发表获奖感言。",a:"BGM可以有——但别每次都放悲壮版。试试快乐点的配乐，说不定打得更顺。",sh:"测完了，我是新月馆的「悲壮主角」。别人流汗是训练，我流汗像剧情进入第二幕。练剑可以没有观众——但我的内心必须有BGM。",tg:["自带BGM","努力很认真也很悲壮","训练即大片"],cd:"L·J·Y·G",bg:"#2a241e",ac:"#8a6a4a",fc:"spark",x:"你活得太用力，也把自己活成了戏——一次普通切返，在你心里都能剪成成长蒙太奇。你渴望「有意义」，渴望努力被看见、被理解，所以总忍不住给每件事加戏。这份悲壮感，其实是你在孤独地等一个观众：你怕自己的付出若无其事地过去、没有重量。可真正的修行，是学会「努力而不表演努力」。别总在聚光灯下给自己配BGM，安静地练、安静地强，你会发现不悲壮的日子，反而更结实。"},
  LJFK:{n:"人形推土机",s:"别人练剑，你像在拆馆。不是在打人——是在攻城。不是很优雅，但非常有压迫感。",d:"你认真起来像推土机。别人还在分配体力你像刚插上电，别人开始喘你刚热身结束。技术细不细不管，强度先拉满。",so:"馆友跟你打完会喘——不是累的，是气你怎么还有电。你是新月馆的体力BUG，大家都以为你该没了结果你还在往前顶。",a:"能量多得有点吓人了。切细一点别全拿来撞墙——你会从体力怪物变成真正的人间凶器。",sh:"测完了，我是新月馆的「人形推土机」。别人练剑我像在拆馆。大家都开始喘了——我还在发电。",tg:["越练越猛","像在攻城","体力无限"],cd:"L·J·F·K",bg:"#1a2028",ac:"#5a7a58",fc:"focus",x:"你能量惊人，越练越猛，像刚插上电。你享受被强度包裹的感觉——用力本身让你踏实，停下来反而心慌，所以惯性是「往前顶」。但推土机式的勤奋，容易变成用体力掩盖思考：反正我在练、我累、我努力，就有交代了。剑道要进步，光有强度不够，得有精度。你的底子好得吓人，若能把「撞墙」的劲分一点去「琢磨细节」，你会从体力怪物变成真正的剑气。别只会烧，更要学会收。"},
  LJFG:{n:"沉默的卷闸",s:"你不吵不闹不喊口号——但你一直在。像一堵慢慢砌起来的墙——一开始不起眼，等大家反应过来已经绕不过你了。",d:"你是馆里最闷的卷王。不表演不喊累不晒朋友圈——就是来、练、走。比你来得晚的来得频的已经走了，你还在。",so:"馆友很少当面夸你——因为你不给机会。一被夸就默默走开，仿佛被夸奖是一种伤害。但大家都知道你是新月馆的地基。",a:"已经够能扛了。偶尔让自己舒服一点——不用每次都把自己当苦行僧。快乐地卷，不丢人。",sh:"测完了，我是新月馆的「沉默的卷闸」。我不吵不闹不喊口号——但我一直在。像一堵墙——不响，但推不动。",tg:["闷头练","静水流深","地基型选手"],cd:"L·J·F·G",bg:"#1a2628",ac:"#5a7260",fc:"calm",x:"你是馆里最闷的卷王——不喊口号、不晒朋友圈，就是来、练、走。你的坚持是地基型的，安静却有分量。但你也几乎不给自己「被看见」的许可：被夸会尴尬，努力从不声张。你可能是怕一旦被注意，就背负期待，失去自洽的节奏。其实偶尔接受一句夸奖、一次展示，不会削弱你的地基，反而让你练得更有回甘。你已经在做最难的事——坚持，也该偶尔让自己舒服一点。"}
};

var gcb=null;
function showFB(ok,msg){
  var fb=document.getElementById("fb");
  if(!fb)return;
  fb.textContent=msg||(ok?"✔️ 做对了":"❌ 按错了");
  fb.className="fb "+(ok?"ok":"fail")+" show";
  setTimeout(function(){fb.className="fb";},500);
}

// 每个小游戏的说明 & 得分规则
var GINFO={
  tap:{ico:"⚡",name:"十分的命",q:"看看你还有多少体力",desc:"10 秒疯狂点击屏幕中央，手速就是体力。",rule:"<b>得分影响：</b><span class=\"sc\">≥100 下→卷力大增；＜70 下→苟力上升</span>",go:"准备好了吗？10 秒倒计时开始！"},
  reaction:{ico:"🗡",name:"方向打击",q:"又快又准才是好剑士",desc:"四个方向会亮起，看见哪个点亮哪个。亮了不点、点错方向都算失误。",rule:"<b>得分影响：</b><span class=\"sc\">命中率高→谋力上升；连击够多→卷力上升</span>",go:"盯紧了，灯一亮就打！"},
  runaway:{ico:"🏃",name:"抓不住的我",q:"按钮会跑，抓住它",desc:"这个按钮一直在逃。三局里抓到的次数越多越好。",rule:"<b>得分影响：</b><span class=\"sc\">抓得越多→莽力上升；抓不到→苟力上升</span>",go:"它要溜了，抓它！"},
  firstmove:{ico:"⚔",name:"先之先",q:"出手还是不出手？1.5 秒决定",desc:"剑道讲究先之先。看场景猜对手下一步——该攻还是该守，1.5 秒内作答。",rule:"<b>得分影响：</b><span class=\"sc\">判断越准→谋力上升</span>",go:"猜中一次，就读懂了一次先机！"},
  dodge:{ico:"🌀",name:"闪躲大作战",q:"四面八方都是攻击，活下来",desc:"拖动角色躲避飞来的攻击。三条命，撑得越久攻击越密，最多 60 秒。",rule:"<b>得分影响：</b><span class=\"sc\">撑得越久→苟力上升；前期就送→莽力上升</span>",go:"屏住呼吸，活过一分钟！"}
};

function startGame(gt,cb){
  try{
    gcb=cb;
    curGame=gt;
    var info=GINFO[gt];
    var tag=document.getElementById("game-tag");
    var title=document.getElementById("game-title");
    var pq2=document.getElementById("pq2");
    if(tag)tag.textContent=info?info.ico+" "+info.name:"验证关卡";
    if(title)title.textContent=info?info.q:"准备好了吗？";

// 得分播报：finish(adj, scoreText, subText)
function finish(adj,scoreText,subText){
  if(curGame)gameScores[curGame]=scoreText;

// ── Reaction Game (4 zones) ──
function itR(ui,finish){
  try{
    var r=0,h=0,m=0,mx=0,cb=0,ac=0,ti,tr=10;
    var pz=["men","kote","do","tsuki"];
    var Z={men:"rM",kote:"rK",do:"rD",tsuki:"rT"};
    var LN={men:"面",kote:"小手",do:"胴",tsuki:"刺喉"};
    var SN={men:"MEN",kote:"KOTE",do:"DO",tsuki:"TSUKI"};
    ui.innerHTML='<div class="r4">'+
      ['men','kote','do','tsuki'].map(function(z){
        return '<div class="r4z" id="'+Z[z]+'">'+LN[z]+'<br><span style="font-size:.5rem;font-weight:400;opacity:.5">'+SN[z]+'</span></div>';
      }).join('')+
      '</div><div class="gi"><span>🎯 <strong id="rI">0</strong>/10</span><span>🔥<span id="rC">0</span></span></div>';
    function rz(){document.querySelectorAll(".r4z").forEach(function(z2){z2.classList.remove("active","hit","miss");});}
    function nr(){
      if(r>=tr){
        var rt=h/(h+m||1);var adj={};
        if(rt>=.7)adj.attack=1;
        if(mx>=5)adj.effort=1;
        if(rt<.4)adj.grit=1;
        var sub= rt>=.7?"又快又准，好剑士":(rt>=.4?"中规中矩":"反应慢了半拍");
        finish(adj,h+" 下命中","命中率 "+Math.round(rt*100)+"%"+(mx>=5?" · 最佳连击 "+mx:""));
        return;
      }
      r++;ac=0;rz();
      setTimeout(function(){
        if(r>tr)return;ac=1;
        var z=pz[Math.floor(Math.random()*4)];
        document.getElementById(Z[z]).classList.add("active");
        document.getElementById("rI").textContent=r+"/"+tr;
        ti=setTimeout(function(){
          if(ac){ac=0;m++;cb=0;showFB(0,"时间到!");document.getElementById("rC").textContent="0";nr();}
        },1800);
      },400);
    }
    document.querySelectorAll(".r4z").forEach(function(zone){
      zone.addEventListener("pointerdown",function(){
        if(!ac)return;clearTimeout(ti);ac=0;
        if(this.classList.contains("active")){
          h++;cb++;if(cb>mx)mx=cb;
          this.classList.remove("active");this.classList.add("hit");
          document.getElementById("rC").textContent=cb;
          showFB(1);
        }else{
          m++;cb=0;
          this.classList.add("miss");
          document.getElementById("rC").textContent="0";
          showFB(0);
        }
        setTimeout(function(){rz();nr();},400);
      });
    });
    setTimeout(nr,500);
  }catch(e){var ge=document.getElementById("game-error");if(ge){ge.style.display="block";ge.textContent+=" | itR: "+e.message;}}
}

// ── Dodge Game（闪躲大作战，替换原憋气breath） ──
function itD(ui,finish){
  try{
    var canvas=document.createElement("canvas");
    canvas.id="dodge-canvas";
    ui.innerHTML="";
    ui.appendChild(canvas);
    ui.insertAdjacentHTML("beforeend",'<div class="dodge-stats"><span>⏱ <b id="dT">0.0</b>s</span><span class="dodge-hearts" id="dH">❤️❤️❤️</span><span><b id="dL">1</b>级</span></div><div class="dodge-tip">按住任意位置拖动角色，躲避飞来的攻击</div>');
    var ctx=canvas.getContext("2d");
    var W=canvas.clientWidth||340,H=canvas.clientHeight||340;
    canvas.width=W;canvas.height=H;
    var player={x:W/2,y:H/2,r:13};
    var bullets=[],lives=3,hitFlash=0,dragging=false;
    var st=performance.now(),lastSpawn=0,maxLevel=1,raf=null,lvTimer=null;
    function setPos(e){
      var rect=canvas.getBoundingClientRect();
      var px=e.clientX-rect.left,py=e.clientY-rect.top;
      player.x=Math.max(player.r,Math.min(W-player.r,px));
      player.y=Math.max(player.r,Math.min(H-player.r,py));
    }
    function onPM(e){if(dragging)setPos(e);}
    function onPU(){dragging=false;}
    canvas.addEventListener("pointerdown",function(e){dragging=true;setPos(e);e.preventDefault();});
    window.addEventListener("pointermove",onPM);
    window.addEventListener("pointerup",onPU);
    function levelFor(t){return 1+Math.floor(t/10);}
    function spawnBurst(lvl){
      var n=2+lvl;
      for(var i=0;i<n;i++){
        var edge=Math.floor(Math.random()*4),x,y;
        if(edge===0){x=Math.random()*W;y=-24;}
        else if(edge===1){x=W+24;y=Math.random()*H;}
        else if(edge===2){x=Math.random()*W;y=H+24;}
        else{x=-24;y=Math.random()*H;}
        var ang=Math.atan2(player.y-y,player.x-x)+(Math.random()*1.3-0.65);
        var sp=(2.3+lvl*0.55)*(W/340);
        bullets.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:4+lvl*0.55});
      }
    }
    function updateHearts(){
      var el=document.getElementById("dH");
      var full=Math.max(0,lives),empty=Math.max(0,3-lives);
      if(el)el.innerHTML='<span class="oh">'+'❤️'.repeat(full)+'</span><span class="od">'+'❤️'.repeat(empty)+'</span>';
    }
    function done(){
      if(raf)cancelAnimationFrame(raf);
      if(lvTimer)clearInterval(lvTimer);
      window.removeEventListener("pointermove",onPM);
      window.removeEventListener("pointerup",onPU);
      var el=(performance.now()-st)/1000;
      var adj={};
      if(el>=40)adj.grit=(adj.grit||0)+1;
      if(el>=20)adj.grit=(adj.grit||0)+1;
      if(el<12)adj.attack=(adj.attack||0)+1;
      if(el<6)adj.attack=(adj.attack||0)+1;
      var sub= el>=55?"极限走位，这个密度几乎不可能活下来":(el>=40?"身法了得，闪躲大师":(el>=20?"有惊无险，够能苟":(el>=8?"运气不错":"手都来不及举起来")));
      finish(adj,el.toFixed(1)+"秒",sub);
    }
    function loop(){
      var el=(performance.now()-st)/1000;
      if(el>=60){done();return;}
      var lvl=levelFor(el);
      if(lvl>maxLevel)maxLevel=lvl;
      var dl=document.getElementById("dL");if(dl)dl.textContent=lvl;
      var spawnInterval=Math.max(0.14,0.9-lvl*0.14);
      var now=performance.now();
      if(now-lastSpawn>spawnInterval*1000){spawnBurst(lvl);lastSpawn=now;}
      ctx.clearRect(0,0,W,H);
      for(var i=bullets.length-1;i>=0;i--){
        var b=bullets[i];
        b.x+=b.vx;b.y+=b.vy;
        ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.fillStyle=lvl>=4?"#ff5252":"rgba(255,90,70,.85)";
        ctx.fill();
        if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){bullets.splice(i,1);continue;}
        var dx=b.x-player.x,dy=b.y-player.y;
        if(Math.sqrt(dx*dx+dy*dy)<player.r+b.r){
          bullets.splice(i,1);lives--;hitFlash=1;updateHearts();
          if(lives<=0){done();return;}
        }
      }
      if(hitFlash>0)hitFlash*=.92;
      var pr=player.r*(1+hitFlash*.6);
      ctx.beginPath();ctx.arc(player.x,player.y,pr,0,Math.PI*2);
      ctx.fillStyle=hitFlash>.3?"#ff5252":"#f0d68a";
      ctx.fill();
      ctx.lineWidth=2.5;ctx.strokeStyle="#0b0e17";ctx.stroke();
      ctx.beginPath();ctx.arc(player.x,player.y,player.r-5,0,Math.PI*2);
      ctx.strokeStyle="rgba(11,14,23,.45)";ctx.lineWidth=2;ctx.stroke();
      var dt=document.getElementById("dT");if(dt)dt.textContent=el.toFixed(1);
      raf=requestAnimationFrame(loop);
    }
    updateHearts();
    loop();
  }catch(e){var ge=document.getElementById("game-error");if(ge){ge.style.display="block";ge.textContent+=" | itD: "+e.message;}}
}

    +'<path d="M215 212c20 4 36 18 46 38" stroke="'+ac+'" stroke-width="20" stroke-linecap="round" fill="none"/>'
    +'<path d="M128 212c-22 5-40 20-48 44" stroke="'+dk+'" stroke-width="5" stroke-linecap="round" fill="none" opacity=".9"/>'

}

// ── DOM ──
const $=id=>document.getElementById(id);
const hero=$('hero'),panel=$('quiz-panel'),stage=$('quiz-stage'),rpanel=$('result-panel');
const pf=$('pf'),pq=$('pq'),qtag=$('qtag'),qtitle=$('qtitle'),qopts=$('qopts');
const rn=$('rname'),rc=$('rcode'),rm=$('rmatch'),rs=$('rsum'),rt=$('rtags'),rd=$('rdim'),rsh=$('rshare');
const rd2=$('rdetail'),rso=$('rsocial'),rad=$('radvice');

function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}


// ── 题库抽取 & 答题编排 ──
var SUB=28;              // 每次抽取的题数
var deck=[];             // 本次关卡序列(题+游戏穿插)
var gameScores={};       // 各小游戏成绩
var curGame=null;        // 当前游戏类型

function makeDeck(){
  var pool=sf(QPOOL);
  var picks=pool.slice(0,SUB);
  var games=sf(['tap','reaction','runaway','firstmove','dodge']);
  var slots=new Array(picks.length+games.length);
  var targets=[],gap=Math.max(1,Math.floor(slots.length/(games.length+1)));
  for(var i=1;i<=games.length;i++){
    var at=i*gap-1+Math.floor(Math.random()*(gap+1));
    if(at>=slots.length)at=slots.length-1;
    targets.push(at);
  }
  targets.sort(function(a,b){return a-b;});
  for(var i=0;i<games.length;i++){slots[targets[i]]={g:games[i]};}
  var qi=0;
  for(var i=0;i<slots.length;i++){if(!slots[i])slots[i]={q:picks[qi++]};}
  return slots;
}

function start(){
  cur=0;Object.keys(scores).forEach(k=>{scores[k]=0;last[k]=0});
  gameScores={};
  deck=makeDeck();
  hero.classList.add('hidden');panel.classList.remove('hidden');
  stage.classList.remove('hidden');rpanel.classList.add('hidden');
  renderQ();panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function advance(){
  cur++;
  if(cur<deck.length){renderQ();}
  else{showR();}
}

function renderQ(){
  var node=deck[cur];
  pf.style.width=((cur+1)/deck.length*100)+'%';
  pq.textContent='第 '+(cur+1)+' / '+deck.length+' 关';
  if(node.q){
    var q=node.q;
    qtag.textContent='第 '+(cur+1)+' 题';
    qtitle.textContent=q.t;
    qopts.innerHTML='';
    sf(q.o).forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt-btn';
      b.innerHTML='<strong>'+String.fromCharCode(65+i)+'</strong><span>'+o.l+'</span>';
      b.addEventListener('click',()=>ans(o.e));
      qopts.appendChild(b);
    });
  }else{
    qtag.textContent='验证关卡';
    startGame(node.g,function(){advance();});
  }
}

function ans(e){
  Object.keys(e).forEach(function(k){scores[k]+=e[k];last[k]=e[k]<0?-1:1;});
  advance();
}

// ── 动态深度解析：16型是骨架，你这局的选择决定分析说什么 ──
function band(v){return v>=2?2:(v<=-2?0:1);}
function buildAnalysis(type,sc,gs){
  var res=R[type];
  var d=[
    {k:'攻',v:sc.attack,hi:'你这局最扎眼的是攻性——出手信号密、敢动先手，剑还没到，意图先到了。',md:'你这局攻性中等——会出手，但多数时候在等个稳妥的机会。',lo:'你这局偏谋不偏攻——出手前先想三步，锋芒收在判断后面。'},
    {k:'炼',v:sc.effort,hi:'你这局最硬的是对自己下手——练起来不跟身体讲价，别人停你不一定停。',md:'你这局投入度稳——不至于死磕，但该练的没落下。',lo:'你这局偏养生态——能省则省，命比练重要。'},
    {k:'显',v:sc.vibe,hi:'你这局气质偏静——存在感收得住，多数时候先沉默观察。',md:'你这局显隐中道——该出场出场，该隐身也不含糊。',lo:'你这局存在感拉满——热闹有你、话题有你，藏不住。'},
    {k:'韧',v:sc.grit,hi:'你这局最扛的是韧——能忍、能熬，被打下去了还能再站起来。',md:'你这局韧度中平——遇强未必硬顶，但也不会一碰就撤。',lo:'你这局偏刚直——上头就冲，吃不得窝囊气，容易一锤子买卖。'}
  ];
  var sd=d.slice().sort(function(a,b){return b.v-a.v;});
  var top=sd[0],second=sd[1],low=sd[3];
  var tmap={
    '攻+炼':'攻性配狠劲，你这局是奔着「练出真东西」去的，不是来出出汗的。',
    '攻+韧':'攻性加韧劲，是种「钝感狠」——不脆，但持续施压，盯上就不放。',
    '攻+显':'攻性配静气，最容易被低估——看着不动，其实一直在算计。',
    '炼+韧':'狠劲加韧劲，是「熬」型的底子——不声不响，赢在最后。',
    '炼+显':'狠劲配沉默，是闷声下苦功的路子——别人注意不到，你一直在长。',
    '显+韧':'静气配韧劲，像沉底的石头——掀不动，也磨不软。'
  };
  var combo=[top.k,second.k].sort().join('+');
  var tension=tmap[combo]||('你的'+top.k+second.k+'两股劲叠在一起，成了别人看不懂的节奏。');
  var grow={
    '攻':'你要修的，是偶尔把「想」放下先「动」——你的判断够用了，缺的是那一下莽。',
    '炼':'你要补的，是对自己再狠一点——你缺的从来不是技巧，是没被算进去的那点拼劲。',
    '显':'你要学的，是让存在感冒点头——本事藏得太好，别人没法向你靠近。',
    '韧':'你要练的，是收住那口气——刚是好事，但剑道更怕上头那一下把节奏搭进去。'
  }[low.k];
  var gsLine='';
  if(gs&&Object.keys(gs).length){
    var secs=parseFloat(gs.dodge)||0;
    if(secs>40)gsLine+='；闪躲撑到'+secs+'秒，你的「苟」不是怂，是真有几条命在盘';
    else if(secs>=25)gsLine+='；闪躲'+secs+'秒，对危险的感知偏敏锐';
    else if(secs>0)gsLine+='；闪躲'+secs+'秒，你更爱正面刚，不太恋战';
    if(gs.firstmove&&gs.firstmove.indexOf('4/5')>=0)gsLine+='；先之先判断偏准，出手时机是你的强项';
    if(!gsLine)gsLine='；小游戏这局整体手速在线，反应跟得上';
  }
  return '【'+top.k+'主导·'+low.k+'待补】'+top[ ['lo','md','hi'][band(top.v)] ]+' 骨子里你仍是「'+res.n+'」——'+res.s+' '+tension+' '+grow+gsLine;
}

function showR(){
  const c=code(),res=R[c],m=mp();
  const dims=[ab('attack'),ab('effort'),ab('vibe'),ab('grit')];
  rn.textContent=res.n;rc.textContent=res.cd;
  rm.textContent='匹配度 '+m+'%';
  $('ravatar').innerHTML='<img src="assets/'+res.n+'.webp" alt="'+res.n+'">';
  var rdp=document.getElementById('rdeep');if(rdp)rdp.textContent=buildAnalysis(code(),scores,gameScores);
  rs.textContent=res.s;rd2.textContent=res.d;rso.textContent=res.so;
  rad.textContent=res.a;rsh.textContent=res.sh;
  var rg=document.getElementById('rgame');
  if(rg){
    var gk=Object.keys(gameScores),gl=GINFO;
    if(gk.length)rg.innerHTML=gk.map(function(k){var nm=(gl[k]?gl[k].ico+' '+gl[k].name:k);return '<span style="color:#d4a853;font-weight:600">'+nm+'</span>：'+gameScores[k];}).join('<br>');
    else rg.textContent='本局未触发小游戏。';
  }
  rt.innerHTML='';res.tg.forEach(t=>{const s=document.createElement('span');s.textContent=t;rt.appendChild(s)});
  // dims hidden
  stage.classList.add('hidden');panel.classList.add('hidden');
  rpanel.classList.remove('hidden');rpanel.scrollIntoView({behavior:'smooth',block:'start'});
}

$('start-quiz').addEventListener('click',start);
$('restart-quiz').addEventListener('click',start);
$('copy-result').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(rsh.textContent);$('copy-result').textContent='已复制';setTimeout(()=>{$('copy-result').textContent='复制文案'},1600)}
  catch(e){$('copy-result').textContent='复制失败，请手动长按'}
});
</script>
